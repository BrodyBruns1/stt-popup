<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; connect-src 'self' http://10.201.52.171:8200 ws://10.201.52.171:8200; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 80px;
    height: 38px;
    background: transparent;
    overflow: hidden;
    font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  }

  .pill {
    width: 36px;
    height: 20px;
    border-radius: 3px;
    background: #111;
    border: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.18s ease, height 0.18s ease, border-color 0.18s ease;
    overflow: visible;
  }

  /* Hover expands pill and reveals info block */
  .pill:hover {
    width: 72px;
    height: 34px;
    border-color: #3a3a3a;
  }

  /* -- Dot (default: dim static; recording: blinking red; wake: dim blue) -- */
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ef4444;
    opacity: 0.25;
    flex-shrink: 0;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: left 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
    z-index: 2;
  }
  .pill.recording .dot {
    opacity: 1;
    animation: blink 1.1s ease-in-out infinite;
  }
  .pill.wake .dot {
    background: #60a5fa;
    opacity: 0.5;
  }
  .pill.processing .dot,
  .pill.done .dot,
  .pill.error .dot { display: none; }

  .pill:hover .dot {
    left: 10px;
    transform: translate(0, -50%);
  }

  /* -- Info block: timer + gain bar, centered, revealed on hover -- */
  .info {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.15s ease 0.05s;
    pointer-events: none;
  }
  .pill:hover .info { opacity: 1; }

  .timer {
    font-size: 14px;
    color: #777;
    letter-spacing: 0.04em;
    white-space: nowrap;
    line-height: 1;
  }

  .gain-track {
    width: 50px;
    height: 2px;
    background: #1e1e1e;
    border-radius: 1px;
    overflow: hidden;
  }
  .gain-fill {
    height: 100%;
    width: 0%;
    background: #ef4444;
    opacity: 0.55;
    border-radius: 1px;
    transition: width 0.04s;
  }

  /* -- Spinner (processing) -- */
  .spinner {
    width: 10px;
    height: 10px;
    border: 1.5px solid #1e1e1e;
    border-top-color: #444;
    border-radius: 50%;
    flex-shrink: 0;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .pill.processing .spinner { display: block; }

  /* -- Check (done) -- */
  .icon-check {
    color: #444;
    flex-shrink: 0;
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  .pill.done .icon-check { display: block; }

  /* -- X (error) -- */
  .icon-x {
    color: #555;
    flex-shrink: 0;
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  .pill.error .icon-x { display: block; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
</style>
</head>
<body>
<div class="pill" id="pill">
  <div class="dot"></div>
  <div class="spinner"></div>
  <svg class="icon-check" width="11" height="11" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <svg class="icon-x" width="10" height="10" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
  <div class="info">
    <div class="timer" id="timerLbl">0:00</div>
    <div class="gain-track"><div class="gain-fill" id="levelFill"></div></div>
  </div>
</div>
<!-- existing <script> block unchanged below -->

<script>
const WS_API = 'ws://10.201.52.171:8200/ws/transcribe';
const pill = document.getElementById('pill');
const levelFill = document.getElementById('levelFill');
const timerLbl = document.getElementById('timerLbl');

let audioCtx = null;
let analyser = null;
let processor = null;
let mutedGain = null;
let source = null;
let meterRAF = null;
let stream = null;
let ws = null;
let pendingFrames = [];
let liveDraft = '';
let activeLanguage = 'en';
let currentState = 'idle';
let silenceTimer = null;
let recordStart = 0;
let timerInterval = null;
let draggable = false;
let dragOriginX = 0;
let dragOriginY = 0;
let wakeModeEnabled = false;
let wakeReconnectTimer = null;
let wakePhrase = 'Hey Jenkins';
let customDictionaryText = '';
let wakeRecentTranscripts = [];
let finalizeStopTimer = null;

const WAKE_PARTIAL_INTERVAL_MS = 550;
const WAKE_ROTATE_MS = 5200;
const WAKE_HISTORY_MS = 6500;
const FINALIZE_GRACE_MS = 260;
const WAKE_TOKEN_ALIASES = {
  hey: ['hay', 'hi', 'he'],
  jenkins: ['jenkin', 'jenkens', 'jenkis', 'jinkins', 'genkins'],
};

const SILENCE_GRACE = 1100;
let SILENCE_DELAY = 1800;
const SILENCE_RMS = 0.009;

function sanitizeWakePhrase(value) {
  const normalized = String(value || '')
    .replace(/\s+/g, ' ')
    .trim();
  return normalized || 'Hey Jenkins';
}

function sanitizeCustomDictionaryText(value) {
  return String(value || '')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');
}

function parseCustomDictionary(text) {
  return sanitizeCustomDictionaryText(text)
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      if (line.includes('=>')) {
        const [left, ...rightParts] = line.split('=>');
        return { left: left.trim(), right: rightParts.join('=>').trim() };
      }

      const braceMatch = line.match(/^\{(.+?)\}\s+(.+)$/);
      if (braceMatch) {
        return { left: braceMatch[1].trim(), right: braceMatch[2].trim() };
      }

      return null;
    })
    .filter(Boolean)
    .map(rule => {
      const matches = rule.left
        .split('|')
        .map(value => value.trim())
        .filter(Boolean);
      const replacement = rule.right.trim();
      if (!matches.length || !replacement) {
        return null;
      }
      return { matches, replacement };
    })
    .filter(Boolean);
}

function wakePromptText() {
  return 'Say "' + wakePhrase + '"';
}

function clearFinalizeStopTimer() {
  if (finalizeStopTimer) {
    clearTimeout(finalizeStopTimer);
    finalizeStopTimer = null;
  }
}

function normalizeWakeText(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/[\u2018\u2019']/g, '')
    .replace(/[^a-z0-9\s]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function wakeTokens(text) {
  return normalizeWakeText(text).split(' ').filter(Boolean);
}

function tokenEditDistance(a, b) {
  if (a === b) return 0;
  const rows = a.length + 1;
  const cols = b.length + 1;
  const dp = Array.from({ length: rows }, (_, row) => Array(cols).fill(row === 0 ? 0 : row));
  for (let col = 0; col < cols; col += 1) {
    dp[0][col] = col;
  }
  for (let row = 1; row < rows; row += 1) {
    for (let col = 1; col < cols; col += 1) {
      const cost = a[row - 1] === b[col - 1] ? 0 : 1;
      dp[row][col] = Math.min(
        dp[row - 1][col] + 1,
        dp[row][col - 1] + 1,
        dp[row - 1][col - 1] + cost,
      );
    }
  }
  return dp[a.length][b.length];
}

function wakeTokenMatches(candidate, target) {
  if (candidate === target) return true;
  const aliases = WAKE_TOKEN_ALIASES[target];
  if (aliases && aliases.includes(candidate)) return true;
  const maxLen = Math.max(candidate.length, target.length);
  if (!maxLen) return false;
  const distance = tokenEditDistance(candidate, target);
  if (maxLen <= 3) return distance <= 1;
  if (maxLen <= 4) return distance === 0;
  if (maxLen <= 7) return distance <= 1;
  return distance <= 2;
}

function heardWakePhrase(text) {
  const phrase = wakeTokens(wakePhrase);
  const heard = wakeTokens(text);
  if (!phrase.length || !heard.length) return false;

  let phraseIndex = 0;
  for (const token of heard) {
    if (wakeTokenMatches(token, phrase[phraseIndex])) {
      phraseIndex += 1;
      if (phraseIndex >= phrase.length) {
        return true;
      }
    }
  }
  return false;
}

function combinedWakeText(nextText) {
  const now = Date.now();
  if (nextText) {
    wakeRecentTranscripts.push({ text: normalizeWakeText(nextText), at: now });
  }
  wakeRecentTranscripts = wakeRecentTranscripts.filter(entry => entry.text && now - entry.at <= WAKE_HISTORY_MS);
  return wakeRecentTranscripts.map(entry => entry.text).join(' ').trim();
}

function setState(state, _text) {
  currentState = state;
  pill.className = 'pill' + (state && state !== 'idle' ? ' ' + state : '');
}

function startTimer() {
  recordStart = Date.now();
  timerLbl.textContent = '0:00';
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - recordStart) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    timerLbl.textContent = m + ':' + String(s).padStart(2, '0');
  }, 500);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function formatToneLabel(tone) {
  if (!tone || !tone.label) return '';
  return tone.label.charAt(0).toUpperCase() + tone.label.slice(1);
}

function buildTranscriptPayload(payload, partial) {
  if (payload && typeof payload === 'object') {
    const rawText = String(payload.text || '').trim();
    const expressiveText = String(payload.expressive_text || rawText).trim();
    return {
      text: expressiveText || rawText,
      raw_text: rawText || expressiveText,
      expressive_text: expressiveText || rawText,
      tone: payload.tone || null,
      partial: !!partial,
      language: payload.language || activeLanguage,
    };
  }

  const text = String(payload || '').trim();
  return {
    text,
    raw_text: text,
    expressive_text: text,
    tone: null,
    partial: !!partial,
    language: activeLanguage,
  };
}

function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < float32Array.length; i += 1) {
    const sample = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
  }
  return buffer;
}

function sendAudioFrame(frame) {
  if (!ws) return;
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(frame);
    return;
  }
  if (ws.readyState === WebSocket.CONNECTING) {
    pendingFrames.push(frame);
  }
}

function monitorAudio() {
  if (!analyser) return;
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  const rms = Math.sqrt(data.reduce((sum, value) => sum + value * value, 0) / data.length);

  if (currentState === 'recording') {
    const pct = Math.max(0, Math.min(100, (20 * Math.log10(Math.max(rms, 1e-10)) + 60) / 60 * 100));
    levelFill.style.width = pct + '%';

    if (isFinite(SILENCE_DELAY) && Date.now() - recordStart > SILENCE_GRACE) {
      if (rms < SILENCE_RMS) {
        if (!silenceTimer) silenceTimer = setTimeout(stopRecording, SILENCE_DELAY);
      } else if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }
    }
  } else {
    levelFill.style.width = '0%';
  }

  meterRAF = requestAnimationFrame(monitorAudio);
}

function clearWakeReconnect() {
  if (wakeReconnectTimer) {
    clearTimeout(wakeReconnectTimer);
    wakeReconnectTimer = null;
  }
}

function scheduleWakeReconnect(delay) {
  clearWakeReconnect();
  wakeReconnectTimer = setTimeout(() => {
    if (wakeModeEnabled && currentState === 'wake') {
      openWakeSocket();
    }
  }, delay);
}

function closeSocket() {
  if (ws) {
    try {
      ws.onclose = null;
      ws.close();
    } catch (_) {}
    ws = null;
  }
  pendingFrames = [];
}

function clearAudioGraph() {
  clearFinalizeStopTimer();
  clearWakeReconnect();
  if (meterRAF) {
    cancelAnimationFrame(meterRAF);
    meterRAF = null;
  }
  if (processor) {
    processor.disconnect();
    processor.onaudioprocess = null;
    processor = null;
  }
  if (source) {
    source.disconnect();
    source = null;
  }
  if (mutedGain) {
    mutedGain.disconnect();
    mutedGain = null;
  }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
    analyser = null;
  }
  levelFill.style.width = '0%';
}

function clearAudioPipeline() {
  closeSocket();
  clearAudioGraph();
}

async function ensureAudioPipeline() {
  if (audioCtx && processor && stream) return true;

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (error) {
    setState('error', 'No mic');
    setTimeout(() => {
      if (wakeModeEnabled) {
        setState('wake', wakePromptText());
      } else {
        setState('idle', 'STT');
      }
    }, 2500);
    window.indicatorAPI.transcriptionError();
    return false;
  }

  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  mutedGain = audioCtx.createGain();
  mutedGain.gain.value = 0;

  source.connect(analyser);
  source.connect(processor);
  processor.connect(mutedGain);
  mutedGain.connect(audioCtx.destination);

  processor.onaudioprocess = event => {
    const input = event.inputBuffer.getChannelData(0);
    sendAudioFrame(floatTo16BitPCM(input));
  };

  if (!meterRAF) {
    meterRAF = requestAnimationFrame(monitorAudio);
  }

  return true;
}

function finishWithText(payload, finalLanguage) {
  stopTimer();
  const transcript = buildTranscriptPayload(payload, false);
  if (finalLanguage && !transcript.language) {
    transcript.language = finalLanguage;
  }
  const finalText = (transcript.text || liveDraft || '').trim();
  clearFinalizeStopTimer();
  clearAudioPipeline();
  if (!finalText) {
    if (wakeModeEnabled) {
      setState('wake', wakePromptText());
      setTimeout(() => startWakeMonitoring(), 450);
    } else {
      setState('idle', 'STT');
    }
    window.indicatorAPI.recordingStopped();
    return;
  }

  setState('done', 'Injected');
  window.indicatorAPI.transcriptionLive(transcript);
  window.indicatorAPI.transcriptionReady(transcript);
  setTimeout(() => {
    if (wakeModeEnabled) {
      setState('wake', wakePromptText());
      startWakeMonitoring();
    } else {
      setState('idle', 'STT');
    }
  }, 2200);
}

function activateFromWakeWord() {
  clearWakeReconnect();
  clearFinalizeStopTimer();
  wakeRecentTranscripts = [];
  clearAudioPipeline();
  setState('processing', 'Activating');
  window.indicatorAPI.wakeActivated();
  setTimeout(() => startRecording(true), 140);
}

function openWakeSocket() {
  closeSocket();
  pendingFrames = [];

  const wakeSocket = new WebSocket(WS_API);
  ws = wakeSocket;
  ws.binaryType = 'arraybuffer';

  wakeSocket.addEventListener('open', () => {
    const customDictionary = parseCustomDictionary(customDictionaryText);
    wakeSocket.send(JSON.stringify({
      type: 'start',
      mode: 'wake',
      wake_phrase: wakePhrase,
      sample_rate: audioCtx ? audioCtx.sampleRate : 48000,
      channels: 1,
      language: 'en',
      partial_interval_ms: WAKE_PARTIAL_INTERVAL_MS,
      custom_dictionary: customDictionary,
    }));
    while (pendingFrames.length > 0 && wakeSocket.readyState === WebSocket.OPEN) {
      wakeSocket.send(pendingFrames.shift());
    }
    scheduleWakeReconnect(WAKE_ROTATE_MS);
  });

  wakeSocket.addEventListener('message', event => {
    const payload = JSON.parse(event.data);
    if (payload.type !== 'partial' && payload.type !== 'final') return;

    const heard = payload.text || '';
    const combined = combinedWakeText(heard);
    if (heardWakePhrase(heard) || heardWakePhrase(combined)) {
      activateFromWakeWord();
    }
  });

  wakeSocket.addEventListener('close', () => {
    if (ws === wakeSocket) {
      ws = null;
    }
    if (wakeModeEnabled && currentState === 'wake') {
      scheduleWakeReconnect(180);
    }
  });
}

async function startWakeMonitoring() {
  if (!wakeModeEnabled || currentState === 'recording' || currentState === 'processing') return;
  const ready = await ensureAudioPipeline();
  if (!ready) return;
  liveDraft = '';
  activeLanguage = 'en';
  wakeRecentTranscripts = [];
  setState('wake', wakePromptText());
  openWakeSocket();
}

function stopWakeMonitoring() {
  clearWakeReconnect();
  if (currentState === 'wake') {
    closeSocket();
    clearAudioPipeline();
    setState('idle', 'STT');
  }
}

async function startRecording(fromWake) {
  if (currentState === 'recording') return;
  if (currentState === 'processing' && !fromWake) return;

  if (!fromWake && currentState === 'wake') {
    clearAudioPipeline();
  }

  const ready = await ensureAudioPipeline();
  if (!ready) return;

  liveDraft = '';
  activeLanguage = 'en';
  pendingFrames = [];
  wakeRecentTranscripts = [];
  recordStart = Date.now();
  silenceTimer = null;
  clearFinalizeStopTimer();
  clearWakeReconnect();
  closeSocket();

  ws = new WebSocket(WS_API);
  ws.binaryType = 'arraybuffer';

  ws.addEventListener('open', () => {
    const customDictionary = parseCustomDictionary(customDictionaryText);
    ws.send(JSON.stringify({
      type: 'start',
      mode: 'dictation',
      sample_rate: audioCtx ? audioCtx.sampleRate : 48000,
      channels: 1,
      language: 'en',
      partial_interval_ms: 800,
      custom_dictionary: customDictionary,
    }));
    while (pendingFrames.length > 0 && ws.readyState === WebSocket.OPEN) {
      ws.send(pendingFrames.shift());
    }
  });

  ws.addEventListener('message', event => {
    const payload = JSON.parse(event.data);
    if (payload.type === 'partial') {
      const transcript = buildTranscriptPayload(payload, true);
      liveDraft = transcript.text || liveDraft;
      activeLanguage = transcript.language || activeLanguage;
      setState('recording', '');
      window.indicatorAPI.transcriptionLive(transcript);
      return;
    }

    if (payload.type === 'final') {
      finishWithText(payload, payload.language);
      if (ws) ws.close();
      return;
    }

    if (payload.type === 'error') {
      if (currentState === 'processing' && liveDraft) {
        finishWithText(liveDraft, activeLanguage);
        return;
      }
      clearAudioPipeline();
      setState('error', 'Error');
      setTimeout(() => setState('idle', 'STT'), 2500);
      window.indicatorAPI.transcriptionError();
    }
  });

  ws.addEventListener('close', () => {
    ws = null;
  });

  setState('recording', 'Recording');
  startTimer();
}

function stopRecording() {
  if (currentState !== 'recording') return;

  if (silenceTimer) {
    clearTimeout(silenceTimer);
    silenceTimer = null;
  }

  setState('processing', 'Finalizing');
  stopTimer();
  clearFinalizeStopTimer();
  finalizeStopTimer = setTimeout(() => {
    clearAudioGraph();

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('stop');
      return;
    }

    if (liveDraft) {
      finishWithText(liveDraft, activeLanguage);
      return;
    }

    setState('error', 'Error');
    setTimeout(() => setState('idle', 'STT'), 2500);
    window.indicatorAPI.transcriptionError();
  }, FINALIZE_GRACE_MS);
}

window.indicatorAPI.onStart(() => startRecording());
window.indicatorAPI.onStop(() => stopRecording());
window.indicatorAPI.onSetSilence(ms => {
  SILENCE_DELAY = ms;
  if (!isFinite(ms) && silenceTimer) {
    clearTimeout(silenceTimer);
    silenceTimer = null;
  }
});

window.indicatorAPI.onSetWakeMode(enabled => {
  wakeModeEnabled = !!enabled;
  if (wakeModeEnabled) {
    startWakeMonitoring();
  } else {
    stopWakeMonitoring();
  }
});

window.indicatorAPI.onSetWakePhrase(value => {
  wakePhrase = sanitizeWakePhrase(value);
  if (currentState === 'wake') {
    setState('wake', wakePromptText());
  }
});

window.indicatorAPI.onSetCustomDictionary(value => {
  customDictionaryText = sanitizeCustomDictionaryText(value);
});

window.indicatorAPI.onSetDraggable(value => {
  draggable = value;
  pill.style.cursor = value ? 'grab' : 'default';
});

pill.addEventListener('mousedown', event => {
  if (!draggable) return;
  dragOriginX = event.screenX;
  dragOriginY = event.screenY;
  pill.style.cursor = 'grabbing';

  function onMove(moveEvent) {
    const dx = moveEvent.screenX - dragOriginX;
    const dy = moveEvent.screenY - dragOriginY;
    dragOriginX = moveEvent.screenX;
    dragOriginY = moveEvent.screenY;
    window.indicatorAPI.dragIndicator(dx, dy);
  }

  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    pill.style.cursor = 'grab';
  }

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
});
</script>
</body>
