<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' http://10.201.52.171:8200; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 164px;
    height: 44px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .pill {
    width: 164px;
    height: 44px;
    border-radius: 22px;
    background: rgba(12, 14, 24, 0.82);
    border: 1px solid rgba(124, 58, 237, 0.25);
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 16px;
    transition: background 0.18s, border-color 0.18s, opacity 0.18s;
    opacity: 0.45;           /* subtle when idle */
  }

  /* ── States ── */
  .pill.recording {
    background: rgba(28, 6, 6, 0.95);
    border-color: rgba(239, 68, 68, 0.7);
    opacity: 1;
    box-shadow: 0 0 14px rgba(239, 68, 68, 0.25), 0 2px 12px rgba(0,0,0,0.6);
  }
  .pill.processing {
    background: rgba(10, 7, 28, 0.95);
    border-color: rgba(124, 58, 237, 0.7);
    opacity: 1;
    box-shadow: 0 0 14px rgba(124, 58, 237, 0.25), 0 2px 12px rgba(0,0,0,0.6);
  }
  .pill.done {
    background: rgba(4, 24, 14, 0.95);
    border-color: rgba(16, 185, 129, 0.7);
    opacity: 1;
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.2), 0 2px 12px rgba(0,0,0,0.6);
  }
  .pill.error {
    background: rgba(24, 4, 4, 0.95);
    border-color: rgba(239, 68, 68, 0.5);
    opacity: 1;
  }

  /* ── Label ── */
  .lbl {
    font-size: 0.71rem;
    font-weight: 600;
    color: #6b7280;
    white-space: nowrap;
    flex: 1;
    letter-spacing: 0.01em;
  }
  .recording .lbl  { color: #fca5a5; }
  .processing .lbl { color: #c4b5fd; }
  .done .lbl       { color: #6ee7b7; }
  .error .lbl      { color: #f87171; }

  /* ── Icons / indicators ── */
  .icon-mic { color: #374151; flex-shrink: 0; }
  .pill.recording  .icon-mic { display: none; }
  .pill.processing .icon-mic { display: none; }
  .pill.done       .icon-mic { display: none; }
  .pill.error      .icon-mic { display: none; }

  .rec-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
    animation: rec-pulse 1.1s ease-in-out infinite;
    display: none;
  }
  .recording .rec-dot { display: block; }
  @keyframes rec-pulse {
    0%, 100% { transform: scale(1);   opacity: 1;   }
    50%       { transform: scale(1.4); opacity: 0.6; }
  }

  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(124, 58, 237, 0.25);
    border-top-color: #a78bfa;
    border-radius: 50%;
    flex-shrink: 0;
    animation: spin 0.65s linear infinite;
    display: none;
  }
  .processing .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .icon-check { color: #10b981; flex-shrink: 0; display: none; }
  .done .icon-check { display: block; }

  .icon-x { color: #ef4444; flex-shrink: 0; display: none; }
  .error .icon-x { display: block; }

  /* ── Audio level bar (shown only during recording) ── */
  .level-bar {
    position: absolute;
    bottom: 0;
    left: 12px;
    right: 12px;
    height: 2px;
    border-radius: 1px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
    display: none;
  }
  .recording .level-bar { display: block; }
  .level-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7c3aed, #ef4444);
    border-radius: 1px;
    transition: width 0.04s;
  }
</style>
</head>
<body>
<div class="pill" id="pill">
  <!-- Idle -->
  <svg class="icon-mic" width="13" height="13" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8"  y1="23" x2="16" y2="23"/>
  </svg>

  <!-- Recording -->
  <div class="rec-dot"></div>

  <!-- Processing -->
  <div class="spinner"></div>

  <!-- Done -->
  <svg class="icon-check" width="13" height="13" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>

  <!-- Error -->
  <svg class="icon-x" width="12" height="12" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6"  y1="6" x2="18" y2="18"/>
  </svg>

  <span class="lbl" id="lbl">STT</span>

  <div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
</div>

<script>
const API       = 'http://10.201.52.171:8200';
const pill      = document.getElementById('pill');
const lbl       = document.getElementById('lbl');
const levelFill = document.getElementById('levelFill');

// ── State ─────────────────────────────────────────────────────────────────────
let mediaRecorder   = null;
let audioChunks     = [];
let audioCtx        = null;
let analyser        = null;
let meterRAF        = null;
let stream          = null;
let silenceTimer    = null;
let recordStart     = 0;
let currentState    = 'idle';

const SILENCE_GRACE = 1100;   // ms — don't auto-stop in first second
let   SILENCE_DELAY = 1800;   // ms of silence → auto-stop (overridable via IPC)
const SILENCE_RMS   = 0.009;  // RMS threshold

// ── Helpers ───────────────────────────────────────────────────────────────────
function setState(s, text) {
  currentState = s;
  pill.className = 'pill' + (s && s !== 'idle' ? ' ' + s : '');
  lbl.textContent = text;
}

// ── Audio monitor (level meter + silence detection) ───────────────────────────
function monitorAudio() {
  if (!analyser) return;
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  const rms = Math.sqrt(data.reduce((s, v) => s + v * v, 0) / data.length);

  // Level bar
  const pct = Math.max(0, Math.min(100,
    (20 * Math.log10(Math.max(rms, 1e-10)) + 60) / 60 * 100));
  levelFill.style.width = pct + '%';

  // Silence detection (after grace period; skipped when SILENCE_DELAY is Infinity)
  if (isFinite(SILENCE_DELAY) && Date.now() - recordStart > SILENCE_GRACE) {
    if (rms < SILENCE_RMS) {
      if (!silenceTimer) silenceTimer = setTimeout(stopRecording, SILENCE_DELAY);
    } else {
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
    }
  }

  meterRAF = requestAnimationFrame(monitorAudio);
}

// ── Start recording ───────────────────────────────────────────────────────────
async function startRecording() {
  if (currentState === 'recording' || currentState === 'processing') return;

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setState('error', 'No mic');
    setTimeout(() => setState('idle', 'STT'), 2500);
    window.indicatorAPI.transcriptionError();
    return;
  }

  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  audioCtx.createMediaStreamSource(stream).connect(analyser);

  audioChunks  = [];
  recordStart  = Date.now();
  silenceTimer = null;

  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : 'audio/webm';

  mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = handleStop;
  mediaRecorder.start(100);

  setState('recording', 'Recording');
  meterRAF = requestAnimationFrame(monitorAudio);
}

// ── Stop recording ────────────────────────────────────────────────────────────
function stopRecording() {
  if (currentState !== 'recording') return;

  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  if (meterRAF)     { cancelAnimationFrame(meterRAF); meterRAF = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (stream)       { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (audioCtx)     { audioCtx.close(); audioCtx = null; analyser = null; }

  levelFill.style.width = '0%';
  setState('processing', 'Thinking…');
}

// ── Transcribe ────────────────────────────────────────────────────────────────
async function handleStop() {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  if (blob.size < 300) {
    setState('idle', 'STT');
    window.indicatorAPI.recordingStopped();
    return;
  }

  const form = new FormData();
  form.append('audio', blob, 'rec.webm');

  try {
    const res  = await fetch(API + '/transcribe', { method: 'POST', body: form });
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    const text = (data.text || '').trim();

    if (!text) {
      setState('idle', 'STT');
      window.indicatorAPI.recordingStopped();
      return;
    }

    setState('done', 'Injected ✓');
    window.indicatorAPI.transcriptionReady(text);
    setTimeout(() => setState('idle', 'STT'), 2200);

  } catch (e) {
    setState('error', 'Error');
    setTimeout(() => setState('idle', 'STT'), 2500);
    window.indicatorAPI.transcriptionError();
  }
}

// ── IPC from main process ─────────────────────────────────────────────────────
window.indicatorAPI.onStart(()     => startRecording());
window.indicatorAPI.onStop(()      => stopRecording());
window.indicatorAPI.onSetSilence(ms => {
  SILENCE_DELAY = ms; // Infinity = manual-stop mode
  if (!isFinite(ms) && silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
});

// ── Drag support (enabled only when full window is open) ─────────────────────
let draggable   = false;
let dragOriginX = 0;
let dragOriginY = 0;

window.indicatorAPI.onSetDraggable(v => {
  draggable = v;
  pill.style.cursor = v ? 'grab' : 'default';
});

pill.addEventListener('mousedown', e => {
  if (!draggable) return;
  dragOriginX = e.screenX;
  dragOriginY = e.screenY;
  pill.style.cursor = 'grabbing';
  function onMove(ev) {
    const dx = ev.screenX - dragOriginX;
    const dy = ev.screenY - dragOriginY;
    dragOriginX = ev.screenX;
    dragOriginY = ev.screenY;
    window.indicatorAPI.dragIndicator(dx, dy);
  }
  function onUp() {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    pill.style.cursor = 'grab';
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
});
</script>
</body>
</html>
