<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://10.201.52.171:8200 ws://10.201.52.171:8200; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>STT Popup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 420px;
    height: 700px;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f0;
    user-select: none;
  }

  .popup {
    width: 420px;
    height: 700px;
    background: rgba(15, 17, 30, 0.97);
    border: 1px solid rgba(124, 58, 237, 0.4);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    height: 40px;
    background: rgba(26, 29, 46, 0.95);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #a78bfa;
    -webkit-app-region: drag;
  }
  .titlebar-left svg { width: 16px; height: 16px; flex-shrink: 0; }
  .hint {
    font-size: 0.7rem;
    color: #4b5563;
    font-weight: 400;
    -webkit-app-region: drag;
  }
  .titlebar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }
  .toggle-btn,
  .close-btn {
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: #4b5563;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, color 0.1s;
    padding: 0;
  }
  .toggle-btn:hover { background: rgba(124,58,237,0.16); color: #c4b5fd; }
  .close-btn:hover { background: rgba(239,68,68,0.15); color: #ef4444; }
  .toggle-btn svg,
  .close-btn svg { width: 14px; height: 14px; }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 10px;
    overflow: hidden;
  }
  .popup.compact-mode {
    width: 360px;
    height: 210px;
  }
  .popup.compact-mode .titlebar {
    height: 34px;
    padding: 0 10px;
  }
  .popup.compact-mode .hint,
  .popup.compact-mode #settingsBtn,
  .popup.compact-mode .settings-panel,
  .popup.compact-mode .copy-row,
  .popup.compact-mode .bottom-row,
  .popup.compact-mode #enhanced,
  .popup.compact-mode label[for="enhanced"],
  .popup.compact-mode #recordBtn,
  .popup.compact-mode #stopBtn,
  .popup.compact-mode .meter-wrap,
  .popup.compact-mode .silence-row,
  .popup.compact-mode #modelSelect,
  .popup.compact-mode #enhanceBtn,
  .popup.compact-mode #copyRaw,
  .popup.compact-mode #copyEnh,
  .popup.compact-mode #quitBtn {
    display: none !important;
  }
  .popup.compact-mode .body {
    padding: 10px;
    gap: 8px;
  }
  .popup.compact-mode .fields {
    gap: 6px;
  }
  .popup.compact-mode .field {
    flex: 1;
  }
  .popup.compact-mode textarea {
    font-size: 0.8rem;
    min-height: 0;
  }
  .popup.compact-mode .status {
    padding-top: 4px;
  }
  .popup.compact-mode .preview-btn.visible {
    min-width: 84px;
  }

  .settings-panel {
    background: rgba(13, 16, 24, 0.92);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 0 12px;
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.16s ease, padding 0.16s ease, border-color 0.16s ease;
    overflow: hidden;
  }
  .settings-panel.open {
    grid-template-rows: 1fr;
    padding: 12px;
    border-color: rgba(124, 58, 237, 0.24);
  }
  .settings-inner {
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 2px;
  }
  .toggle-field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
  }
  .toggle-copy {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .toggle-copy strong {
    font-size: 0.76rem;
    color: #e2e8f0;
  }
  .toggle-copy span {
    font-size: 0.68rem;
    color: #64748b;
    line-height: 1.35;
  }
  .switch {
    position: relative;
    width: 42px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #1f2937;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .slider::before {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: #cbd5e1;
    transition: transform 0.12s ease;
  }
  .switch input:checked + .slider {
    background: #2563eb;
  }
  .switch input:checked + .slider::before {
    transform: translateX(18px);
    background: white;
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    border: none;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 14px;
    transition: all 0.12s;
    -webkit-app-region: no-drag;
    user-select: none;
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  #recordBtn { background: #7c3aed; color: white; }
  #recordBtn:hover:not(:disabled) { background: #6d28d9; }
  #recordBtn.recording { background: #dc2626; animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(220,38,38,0); }
  }
  #stopBtn { background: #1f2937; color: #9ca3af; }
  #stopBtn:hover:not(:disabled) { background: #374151; color: #e2e8f0; }

  .meter-wrap {
    flex: 1;
    height: 6px;
    background: #1f2937;
    border-radius: 3px;
    overflow: hidden;
  }
  #meter {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7c3aed, #c4b5fd);
    border-radius: 3px;
    transition: width 0.04s;
  }

  .silence-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .silence-row label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #4b5563;
    white-space: nowrap;
  }
  input[type="range"] {
    flex: 1;
    accent-color: #7c3aed;
    cursor: pointer;
    height: 4px;
    -webkit-app-region: no-drag;
  }
  .silence-val {
    font-size: 0.78rem;
    font-weight: 600;
    color: #a78bfa;
    white-space: nowrap;
    min-width: 32px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .fields {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .field {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
  }
  label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #4b5563;
  }
  .live-badge {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #93c5fd;
    display: none;
  }
  .live-badge.visible { display: inline-flex; }
  .tone-row {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .tone-row.visible {
    display: flex;
  }
  .tone-chip {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 0 9px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03);
    color: #94a3b8;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tone-chip.accent { color: #e2e8f0; }
  .tone-chip.soft { border-color: rgba(96, 165, 250, 0.24); color: #bfdbfe; }
  .tone-chip.calm { border-color: rgba(148, 163, 184, 0.18); color: #cbd5e1; }
  .tone-chip.steady { border-color: rgba(56, 189, 248, 0.24); color: #93c5fd; }
  .tone-chip.punchy { border-color: rgba(245, 158, 11, 0.24); color: #fcd34d; }
  .tone-chip.heated { border-color: rgba(248, 113, 113, 0.3); color: #fca5a5; }
  .tone-chip.shouted { border-color: rgba(239, 68, 68, 0.4); color: #fecaca; }
  .raw-note {
    display: none;
    margin-bottom: 6px;
    color: #64748b;
    font-size: 0.71rem;
    line-height: 1.45;
  }
  .raw-note.visible {
    display: block;
  }
  textarea {
    flex: 1;
    background: #0d1018;
    border: 1px solid #1f2937;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.85rem;
    line-height: 1.55;
    padding: 10px 12px;
    resize: none;
    font-family: inherit;
    min-height: 0;
    -webkit-app-region: no-drag;
  }
  input[type="text"] {
    background: #0d1018;
    border: 1px solid #1f2937;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.83rem;
    line-height: 1.4;
    padding: 10px 12px;
    font-family: inherit;
    -webkit-app-region: no-drag;
  }
  input[type="text"]:focus,
  textarea:focus { outline: none; border-color: #7c3aed; }
  .settings-textarea {
    min-height: 84px;
    max-height: 84px;
    font-size: 0.78rem;
    line-height: 1.45;
  }

  .bottom-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  select {
    background: #0d1018;
    border: 1px solid #1f2937;
    border-radius: 7px;
    color: #9ca3af;
    font-size: 0.75rem;
    padding: 6px 8px;
    flex: 1;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  select:focus { outline: none; border-color: #7c3aed; }
  #enhanceBtn {
    background: #064e3b;
    color: #6ee7b7;
    font-size: 0.78rem;
    white-space: nowrap;
    padding: 7px 12px;
    flex-shrink: 0;
  }
  #enhanceBtn:hover:not(:disabled) { background: #065f46; }
  .copy-btn {
    background: #1f2937;
    color: #6b7280;
    font-size: 0.72rem;
    padding: 5px 9px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .copy-btn:hover:not(:disabled) { background: #374151; color: #e2e8f0; }
  .danger-btn {
    background: #3b0d11;
    color: #fca5a5;
    font-size: 0.74rem;
    white-space: nowrap;
    padding: 7px 12px;
    flex-shrink: 0;
  }
  .danger-btn:hover:not(:disabled) {
    background: #5d1117;
    color: #fecaca;
  }

  .status {
    font-size: 0.72rem;
    color: #4b5563;
    padding: 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
    min-height: 18px;
  }
  .status-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .status-left span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #374151;
  }
  .dot.ready { background: #10b981; }
  .dot.busy { background: #f59e0b; animation: blink 0.8s infinite; }
  .dot.error { background: #ef4444; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .spinner {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
    border: 1.5px solid #374151;
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .preview-btn {
    background: rgba(124, 58, 237, 0.16);
    color: #c4b5fd;
    font-size: 0.7rem;
    padding: 5px 9px;
    border-radius: 6px;
    display: none;
  }
  .preview-btn.visible {
    display: inline-flex;
  }
  .preview-btn:hover:not(:disabled) {
    background: rgba(124, 58, 237, 0.26);
    color: #ede9fe;
  }
</style>
</head>
<body>
<div class="popup">
  <div class="titlebar">
    <div class="titlebar-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      Speech to Text
      <span class="hint">Ctrl+Shift+Space to hide</span>
    </div>
    <div class="titlebar-actions">
      <button class="toggle-btn" id="settingsBtn" title="Show settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7a3.5 3.5 0 0 0 0 7z"/>
          <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a2 2 0 0 1 0 2.8l-.1.1a2 2 0 0 1-2.8 0l-.1-.1a1 1 0 0 0-1.1-.2a1 1 0 0 0-.6.9V20a2 2 0 0 1-2 2h-.2a2 2 0 0 1-2-2v-.2a1 1 0 0 0-.6-.9a1 1 0 0 0-1.1.2l-.1.1a2 2 0 0 1-2.8 0l-.1-.1a2 2 0 0 1 0-2.8l.1-.1a1 1 0 0 0 .2-1.1a1 1 0 0 0-.9-.6H4a2 2 0 0 1-2-2v-.2a2 2 0 0 1 2-2h.2a1 1 0 0 0 .9-.6a1 1 0 0 0-.2-1.1l-.1-.1a2 2 0 0 1 0-2.8l.1-.1a2 2 0 0 1 2.8 0l.1.1a1 1 0 0 0 1.1.2a1 1 0 0 0 .6-.9V4a2 2 0 0 1 2-2h.2a2 2 0 0 1 2 2v.2a1 1 0 0 0 .6.9a1 1 0 0 0 1.1-.2l.1-.1a2 2 0 0 1 2.8 0l.1.1a2 2 0 0 1 0 2.8l-.1.1a1 1 0 0 0-.2 1.1a1 1 0 0 0 .9.6h.2a2 2 0 0 1 2 2v.2a2 2 0 0 1-2 2h-.2a1 1 0 0 0-.9.6z"/>
        </svg>
      </button>
      <button class="close-btn" id="closeBtn" title="Hide to tray">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="body">
    <div class="fields">
      <div class="field">
        <div class="label-row">
          <label>Transcription</label>
          <span class="live-badge" id="liveBadge">Live Draft</span>
        </div>
        <div class="tone-row" id="toneRow">
          <span class="tone-chip accent calm" id="toneLabelChip">Calm</span>
          <span class="tone-chip" id="tonePitchChip">Pitch level</span>
          <span class="tone-chip" id="toneEmphasisChip">Emphasis 0%</span>
        </div>
        <div class="raw-note" id="rawNote"></div>
        <textarea id="transcription" placeholder="Click Record and start speaking..."></textarea>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-inner">
        <div class="toggle-field">
          <div class="toggle-copy">
            <strong>Wake Phrase</strong>
            <span id="wakePhraseHint">Always listen for your wake phrase and start quick-record automatically.</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="wakeToggle">
            <span class="slider"></span>
          </label>
        </div>

        <div class="field">
          <label for="wakePhraseInput">Wake phrase text</label>
          <input id="wakePhraseInput" type="text" placeholder="Hey Jenkins" autocomplete="off" spellcheck="false">
        </div>

        <div class="field">
          <label for="customDictionaryInput">Custom dictionary</label>
          <textarea id="customDictionaryInput" class="settings-textarea" placeholder="{clod} claude&#10;{innate in} n8n&#10;anthropic | clawed => Claude"></textarea>
        </div>

        <div class="toggle-field">
          <div class="toggle-copy">
            <strong>Press Enter After Paste</strong>
            <span>After quick-paste inserts the transcription, automatically press Enter in the target text box.</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoEnterToggle">
            <span class="slider"></span>
          </label>
        </div>

        <div class="controls">
          <button id="recordBtn">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
            Record
          </button>
          <button id="stopBtn" disabled>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            Stop
          </button>
          <div class="meter-wrap"><div id="meter"></div></div>
        </div>

        <div class="silence-row">
          <label for="silenceSlider">Silence</label>
          <input type="range" id="silenceSlider" min="0" max="100" value="0">
          <span class="silence-val" id="silenceVal">1.8s</span>
        </div>

        <div class="field">
          <label>Enhanced</label>
          <textarea id="enhanced" placeholder="Click Enhance with AI..."></textarea>
        </div>

        <div class="bottom-row">
          <select id="modelSelect">
            <option value="mistral-nemo:latest">mistral-nemo</option>
            <option value="llama3.1:latest">llama3.1</option>
          </select>
          <button id="enhanceBtn" disabled>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            Enhance
          </button>
          <button class="copy-btn" id="copyRaw">Copy</button>
          <button class="copy-btn" id="copyEnh">Copy AI</button>
        </div>

        <div class="bottom-row">
          <button class="danger-btn" id="quitBtn">Quit App</button>
        </div>
      </div>
    </div>

    <div class="status">
      <div class="status-left">
        <div class="dot ready" id="statusDot"></div>
        <span id="statusText">Ready</span>
      </div>
      <button class="preview-btn" id="previewActionBtn">Done</button>
    </div>
  </div>
</div>

<script>
const HTTP_API = 'http://10.201.52.171:8200';
const WS_API = 'ws://10.201.52.171:8200/ws/transcribe';

const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const popupEl = document.querySelector('.popup');
const recordBtn = document.getElementById('recordBtn');
const stopBtn = document.getElementById('stopBtn');
const enhanceBtn = document.getElementById('enhanceBtn');
const meter = document.getElementById('meter');
const transcription = document.getElementById('transcription');
const enhanced = document.getElementById('enhanced');
const modelSelect = document.getElementById('modelSelect');
const statusText = document.getElementById('statusText');
const liveBadge = document.getElementById('liveBadge');
const toneRow = document.getElementById('toneRow');
const toneLabelChip = document.getElementById('toneLabelChip');
const tonePitchChip = document.getElementById('tonePitchChip');
const toneEmphasisChip = document.getElementById('toneEmphasisChip');
const rawNote = document.getElementById('rawNote');
const wakeToggle = document.getElementById('wakeToggle');
const wakePhraseInput = document.getElementById('wakePhraseInput');
const wakePhraseHint = document.getElementById('wakePhraseHint');
const customDictionaryInput = document.getElementById('customDictionaryInput');
const autoEnterToggle = document.getElementById('autoEnterToggle');
const previewActionBtn = document.getElementById('previewActionBtn');
const quitBtn = document.getElementById('quitBtn');

let audioCtx = null;
let analyser = null;
let processor = null;
let mutedGain = null;
let source = null;
let stream = null;
let ws = null;
let meterRAF = null;
let pendingFrames = [];
let liveDraft = '';
let activeLanguage = 'en';
let settingsOpen = false;
let quickPreviewStage = 'idle';
let currentWakePhrase = 'Hey Jenkins';
let currentCustomDictionaryText = '';
let finalizeStopTimer = null;
let currentWindowMode = 'full';
let currentRawTranscript = '';
let liveDraftTranscript = null;
let deferredShrinkTranscript = null;
let preRollFrames = [];
let preRollBytes = 0;
const PRE_ROLL_MS = 320;
const SCRIPT_PROCESSOR_SIZE = 2048;

function normalizeTranscriptPayload(payload, options) {
  const settings = options || {};
  if (payload && typeof payload === 'object') {
    const preferRawText = !!settings.preferRawText;
    const partial = settings.partial != null ? !!settings.partial : !!payload.partial;
    const rawText = String(payload.raw_text || payload.rawText || payload.text || '').trim();
    const expressiveText = String(payload.expressive_text || payload.expressiveText || payload.text || '').trim();
    return {
      ...payload,
      text: preferRawText ? (rawText || expressiveText) : (expressiveText || rawText),
      raw_text: rawText || expressiveText,
      expressive_text: expressiveText || rawText,
      tone: payload.tone || null,
      partial,
    };
  }

  const text = String(payload || '').trim();
  return {
    text,
    raw_text: text,
    expressive_text: text,
    tone: null,
  };
}

function transcriptTokens(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]+/g, ' ')
    .split(/\s+/)
    .filter(Boolean);
}

function sharedPrefixCount(left, right) {
  let index = 0;
  while (index < left.length && index < right.length && left[index] === right[index]) {
    index += 1;
  }
  return index;
}

function sharedSuffixCount(left, right) {
  let count = 0;
  while (
    count < left.length &&
    count < right.length &&
    left[left.length - 1 - count] === right[right.length - 1 - count]
  ) {
    count += 1;
  }
  return count;
}

function shouldDeferShrink(currentTranscript, nextTranscript) {
  const currentTokens = transcriptTokens(currentTranscript?.raw_text || currentTranscript?.text || '');
  const nextTokens = transcriptTokens(nextTranscript?.raw_text || nextTranscript?.text || '');

  if (currentTokens.length < 4 || nextTokens.length < 2 || nextTokens.length >= currentTokens.length) {
    return false;
  }

  const shrinkBy = currentTokens.length - nextTokens.length;
  if (shrinkBy < 2) {
    return false;
  }

  const prefixRatio = sharedPrefixCount(currentTokens, nextTokens) / Math.max(1, nextTokens.length);
  const suffixRatio = sharedSuffixCount(currentTokens, nextTokens) / Math.max(1, nextTokens.length);
  return prefixRatio >= 0.75 || suffixRatio >= 0.75;
}

function mergeLiveTranscript(nextTranscript) {
  if (!nextTranscript) return liveDraftTranscript;

  if (!nextTranscript.partial) {
    deferredShrinkTranscript = null;
    liveDraftTranscript = nextTranscript;
    return nextTranscript;
  }

  if (!liveDraftTranscript || !(liveDraftTranscript.raw_text || liveDraftTranscript.text)) {
    deferredShrinkTranscript = null;
    liveDraftTranscript = nextTranscript;
    return nextTranscript;
  }

  const currentRaw = liveDraftTranscript.raw_text || liveDraftTranscript.text || '';
  const nextRaw = nextTranscript.raw_text || nextTranscript.text || '';
  if (!nextRaw) {
    return {
      ...liveDraftTranscript,
      tone: nextTranscript.tone || liveDraftTranscript.tone,
      language: nextTranscript.language || liveDraftTranscript.language,
      partial: true,
    };
  }

  const currentCount = transcriptTokens(currentRaw).length;
  const nextCount = transcriptTokens(nextRaw).length;
  if (nextCount >= currentCount) {
    deferredShrinkTranscript = null;
    liveDraftTranscript = nextTranscript;
    return nextTranscript;
  }

  if (shouldDeferShrink(liveDraftTranscript, nextTranscript)) {
    const sameDeferred = deferredShrinkTranscript
      && (deferredShrinkTranscript.raw_text || deferredShrinkTranscript.text || '') === nextRaw;
    if (!sameDeferred) {
      deferredShrinkTranscript = nextTranscript;
      return {
        ...liveDraftTranscript,
        tone: nextTranscript.tone || liveDraftTranscript.tone,
        language: nextTranscript.language || liveDraftTranscript.language,
        partial: true,
      };
    }
  }

  deferredShrinkTranscript = null;
  liveDraftTranscript = nextTranscript;
  return nextTranscript;
}

function formatToneLabel(tone) {
  if (!tone || !tone.label) return 'Calm';
  return tone.label.charAt(0).toUpperCase() + tone.label.slice(1);
}

function updateToneUI(payload, options) {
  const transcript = normalizeTranscriptPayload(payload, options);
  const tone = transcript.tone;
  const displayText = transcript.text || '';
  currentRawTranscript = transcript.raw_text || displayText;

  if (tone) {
    const toneClass = String(tone.label || 'calm').toLowerCase();
    toneRow.className = 'tone-row visible';
    toneLabelChip.className = 'tone-chip accent ' + toneClass;
    toneLabelChip.textContent = formatToneLabel(tone);
    tonePitchChip.textContent = 'Pitch ' + (tone.pitch_trend || 'level');
    toneEmphasisChip.textContent = 'Emphasis ' + Math.round((Number(tone.emphasis) || 0) * 100) + '%';
  } else {
    toneRow.className = 'tone-row';
    toneLabelChip.className = 'tone-chip accent calm';
    toneLabelChip.textContent = 'Calm';
    tonePitchChip.textContent = 'Pitch level';
    toneEmphasisChip.textContent = 'Emphasis 0%';
  }

  if (currentRawTranscript && displayText && currentRawTranscript !== displayText) {
    rawNote.className = 'raw-note visible';
    rawNote.textContent = 'Raw transcript: ' + currentRawTranscript;
  } else {
    rawNote.className = 'raw-note';
    rawNote.textContent = '';
  }

  return transcript;
}

function sanitizeWakePhrase(value) {
  const normalized = String(value || '')
    .replace(/\s+/g, ' ')
    .trim();
  return normalized || 'Hey Jenkins';
}

function sanitizeCustomDictionaryText(value) {
  return String(value || '')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');
}

function parseCustomDictionary(text) {
  return sanitizeCustomDictionaryText(text)
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      if (line.includes('=>')) {
        const [left, ...rightParts] = line.split('=>');
        return { left: left.trim(), right: rightParts.join('=>').trim() };
      }

      const braceMatch = line.match(/^\{(.+?)\}\s+(.+)$/);
      if (braceMatch) {
        return { left: braceMatch[1].trim(), right: braceMatch[2].trim() };
      }

      return null;
    })
    .filter(Boolean)
    .map(rule => {
      const matches = rule.left
        .split('|')
        .map(value => value.trim())
        .filter(Boolean);
      const replacement = rule.right.trim();
      if (!matches.length || !replacement) {
        return null;
      }
      return { matches, replacement };
    })
    .filter(Boolean);
}

function updateWakePhraseCopy() {
  wakePhraseHint.textContent = `Always listen for "${currentWakePhrase}" and start quick-record automatically.`;
}

function applySettingsOpen(open) {

function setPreviewAction(mode) {

    previewActionBtn.className = 'preview-btn';
    return;
  }

  previewActionBtn.className = 'preview-btn visible';
  previewActionBtn.textContent = mode === 'paste' ? 'Paste Now' : 'Done';
}

function setStatus(message, type) {
  type = type || 'ready';
  statusText.textContent = message;
  const existing = document.getElementById('statusDot') || document.getElementById('spinner');
  if (!existing) return;

  if (type === 'busy') {
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.id = 'spinner';
    existing.replaceWith(spinner);
    return;
  }

  if (existing.id === 'spinner') {
    const dot = document.createElement('div');
    dot.className = 'dot ' + type;
    dot.id = 'statusDot';
    existing.replaceWith(dot);
  } else {
    existing.className = 'dot ' + type;
  }
}

function setLiveMode(enabled) {
  liveBadge.className = 'live-badge' + (enabled ? ' visible' : '');
}

function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < float32Array.length; i += 1) {
    const sample = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
  }
  return buffer;
}

function maxPreRollBytes() {
  const sampleRate = audioCtx ? audioCtx.sampleRate : 48000;
  return Math.max(4096, Math.round(sampleRate * 2 * (PRE_ROLL_MS / 1000)));
}

function rememberPreRollFrame(frame) {
  if (!frame) return;
  preRollFrames.push(frame);
  preRollBytes += frame.byteLength || 0;

  const limit = maxPreRollBytes();
  while (preRollBytes > limit && preRollFrames.length > 1) {
    const dropped = preRollFrames.shift();
    preRollBytes -= dropped ? (dropped.byteLength || 0) : 0;
  }
}

function resetPreRoll() {
  preRollFrames = [];
  preRollBytes = 0;
}

function sendAudioFrame(frame) {
  if (!ws) return;
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(frame);
    return;
  }
  if (ws.readyState === WebSocket.CONNECTING) {
    pendingFrames.push(frame);
  }
}

function clearFinalizeStopTimer() {
  if (finalizeStopTimer) {
    clearTimeout(finalizeStopTimer);
    finalizeStopTimer = null;
  }
}

function closeSocket() {
  if (ws) {
    try {
      ws.close();
    } catch (_) {}
    ws = null;
  }
  pendingFrames = [];
}

function clearAudioGraph() {
  clearFinalizeStopTimer();
  if (meterRAF) {
    cancelAnimationFrame(meterRAF);
    meterRAF = null;
  }
  if (processor) {
    processor.disconnect();
    processor.onaudioprocess = null;
    processor = null;
  }
  if (source) {
    source.disconnect();
    source = null;
  }
  if (mutedGain) {
    mutedGain.disconnect();
    mutedGain = null;
  }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
    analyser = null;
  }
  resetPreRoll();
  meter.style.width = '0%';
}

function clearPipeline() {
  closeSocket();
  clearAudioGraph();
}

function updateMeter() {
  if (!analyser) return;
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  const rms = Math.sqrt(data.reduce((sum, value) => sum + value * value, 0) / data.length);
  const pct = Math.max(0, Math.min(100, (20 * Math.log10(Math.max(rms, 1e-10)) + 60) / 60 * 100));
  meter.style.width = pct + '%';
  meterRAF = requestAnimationFrame(updateMeter);
}

async function startRecording() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (error) {
    setStatus('Mic denied: ' + error.message, 'error');
    return;
  }

  liveDraft = '';
  activeLanguage = 'en';
  pendingFrames = [];
  transcription.value = '';
  currentRawTranscript = '';
  liveDraftTranscript = null;
  deferredShrinkTranscript = null;
  enhanced.value = '';
  updateToneUI(null);
  setLiveMode(true);

  ws = new WebSocket(WS_API);
  ws.binaryType = 'arraybuffer';
  ws.addEventListener('open', () => {
    const customDictionary = parseCustomDictionary(currentCustomDictionaryText);
    ws.send(JSON.stringify({
      type: 'start',
      mode: 'dictation',
      sample_rate: audioCtx ? audioCtx.sampleRate : 48000,
      channels: 1,
      language: 'en',
      partial_interval_ms: 800,
      custom_dictionary: customDictionary,
    }));
    while (pendingFrames.length > 0 && ws.readyState === WebSocket.OPEN) {
      ws.send(pendingFrames.shift());
    }
  });

  ws.addEventListener('message', event => {
    const payload = JSON.parse(event.data);
    if (payload.type === 'partial') {
      const transcriptPayload = mergeLiveTranscript(
        normalizeTranscriptPayload(payload, { preferRawText: true, partial: true })
      );
      updateToneUI(transcriptPayload);
      liveDraft = transcriptPayload.text || liveDraft;
      activeLanguage = transcriptPayload.language || activeLanguage;
      if (liveDraft) transcription.value = liveDraft;
      transcription.scrollTop = transcription.scrollHeight;
      const toneLabel = transcriptPayload.tone ? ' · ' + formatToneLabel(transcriptPayload.tone) : '';
      setStatus('Recording... live draft updating' + toneLabel, 'busy');
      return;
    }

    if (payload.type === 'final') {
      clearAudioGraph();
      const transcriptPayload = normalizeTranscriptPayload(payload);
      liveDraftTranscript = transcriptPayload;
      deferredShrinkTranscript = null;
      updateToneUI(transcriptPayload);
      const finalText = (transcriptPayload.text || liveDraft || '').trim();
      transcription.value = finalText;
      transcription.scrollTop = transcription.scrollHeight;
      setLiveMode(false);
      const lang = payload.language ? '  ' + payload.language.toUpperCase() : '';
      const dur = payload.duration ? '  ' + payload.duration + 's' : '';
      const toneLabel = transcriptPayload.tone ? ' · ' + formatToneLabel(transcriptPayload.tone) : '';
      setStatus('Done' + toneLabel + lang + dur, 'ready');
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      enhanceBtn.disabled = !finalText;
      closeSocket();
      return;
    }

    if (payload.type === 'error') {
      clearAudioGraph();
      if (liveDraft) {
        transcription.value = liveDraft;
        enhanceBtn.disabled = !liveDraft.trim();
        setLiveMode(false);
        setStatus('Draft ready', 'ready');
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        closeSocket();
        return;
      }
      setLiveMode(false);
      setStatus('Error: ' + payload.message, 'error');
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      closeSocket();
    }
  });

  ws.addEventListener('close', () => {
    ws = null;
    pendingFrames = [];
  });

  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(SCRIPT_PROCESSOR_SIZE, 1, 1);
  mutedGain = audioCtx.createGain();
  mutedGain.gain.value = 0;

  source.connect(analyser);
  source.connect(processor);
  processor.connect(mutedGain);
  mutedGain.connect(audioCtx.destination);

  processor.onaudioprocess = event => {
    const input = event.inputBuffer.getChannelData(0);
    const frame = floatTo16BitPCM(input);
    rememberPreRollFrame(frame);
    sendAudioFrame(frame);
  };

  await audioCtx.resume().catch(() => {});
  meterRAF = requestAnimationFrame(updateMeter);
  recordBtn.disabled = true;
  recordBtn.classList.add('recording');
  stopBtn.disabled = false;
  enhanceBtn.disabled = true;
  setStatus('Recording...', 'busy');
}

function stopRecording() {
  clearFinalizeStopTimer();
  recordBtn.classList.remove('recording');
  recordBtn.disabled = true;
  stopBtn.disabled = true;
  setStatus('Finalizing transcript...', 'busy');

  finalizeStopTimer = setTimeout(() => {
    clearAudioGraph();

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('stop');
      return;
    }

    closeSocket();
    setLiveMode(false);
    recordBtn.disabled = false;
    setStatus(liveDraft ? 'Draft ready' : 'Error', liveDraft ? 'ready' : 'error');
  }, 260);
}

async function enhanceText() {
  const text = (currentRawTranscript || transcription.value || '').trim();
  if (!text) return;
  enhanceBtn.disabled = true;
  setStatus('Enhancing...', 'busy');
  try {
    const res = await fetch(HTTP_API + '/enhance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, model: modelSelect.value }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    enhanced.value = (await res.json()).enhanced_text || '';
    setStatus('Enhanced', 'ready');
  } catch (error) {
    setStatus('Error: ' + error.message, 'error');
  } finally {
    enhanceBtn.disabled = false;
  }
}

async function loadModels() {
  try {
    const data = await fetch(HTTP_API + '/models').then(response => response.json());
    if (data.models && data.models.length) {
      modelSelect.innerHTML = '';
      data.models.forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        modelSelect.appendChild(option);
      });
    }
  } catch (_) {}
}

function sliderToMs(value) {
  if (value >= 100) return Infinity;
  return Math.round(1800 * Math.pow(30000 / 1800, value / 99));
}

function msToLabel(ms) {
  if (!isFinite(ms)) return '∞';
  if (ms < 10000) return (ms / 1000).toFixed(1) + 's';
  return Math.round(ms / 1000) + 's';
}

const savedSilence = parseInt(localStorage.getItem('silenceSlider') || '0', 10);

silenceVal.textContent = msToLabel(sliderToMs(savedSilence));
if (window.electronAPI && window.electronAPI.setSilence) {

}

silenceSlider.addEventListener('input', function onSlider() {

  silenceVal.textContent = msToLabel(ms);
  localStorage.setItem('silenceSlider', this.value);
  if (window.electronAPI && window.electronAPI.setSilence) {

});

if (window.electronAPI && window.electronAPI.onLiveText) {
  window.electronAPI.onLiveText(payload => {
    const transcriptPayload = payload && payload.partial
      ? mergeLiveTranscript(normalizeTranscriptPayload(payload, { preferRawText: true, partial: true }))
      : normalizeTranscriptPayload(payload);
    if (!transcriptPayload.partial) {
      liveDraftTranscript = transcriptPayload;
      deferredShrinkTranscript = null;
    }
    updateToneUI(transcriptPayload);
    if (!transcriptPayload.text) return;
    transcription.value = transcriptPayload.text;
    enhanced.value = '';
    enhanceBtn.disabled = !transcriptPayload.text.trim();
    setLiveMode(!!transcriptPayload.partial);
    const toneLabel = transcriptPayload.tone ? ' · ' + formatToneLabel(transcriptPayload.tone) : '';
    setStatus((transcriptPayload.partial ? 'Live preview before paste' : 'Preview ready') + toneLabel, transcriptPayload.partial ? 'busy' : 'ready');
    if (!transcriptPayload.partial) {
      setPreviewAction('paste');
    }
  });
}

if (window.electronAPI && window.electronAPI.onQuickSessionState) {
  window.electronAPI.onQuickSessionState(payload => {
    const stage = payload && payload.stage;
    quickPreviewStage = stage || 'idle';

    if (stage === 'recording') {
      setPreviewAction(null);
      if (!transcription.value.trim()) transcription.value = '';
      enhanced.value = '';
      enhanceBtn.disabled = true;
      setLiveMode(true);
      setStatus('Listening... live preview attached to quick-record', 'busy');
      return;
    }

    if (stage === 'finalizing') {
      applySettingsOpen(false);
      setPreviewAction(null);
      setLiveMode(true);
      setStatus('Finalizing preview before paste...', 'busy');
      return;
    }

    if (stage === 'preview') {
      applySettingsOpen(false);
      setLiveMode(false);
      setStatus('Previewing final text before paste...', 'ready');
      setPreviewAction('paste');
      return;
    }

    if (stage === 'pasted') {
      setLiveMode(false);
      setStatus('Pasted', 'ready');
      setPreviewAction('done');
      return;
    }

    if (stage === 'error') {
      setPreviewAction(null);
      setLiveMode(false);
      setStatus('Quick-record error', 'error');
      return;
    }

    if (stage === 'idle') {
      setPreviewAction(null);
      setLiveMode(false);
      if (!transcription.value.trim()) {
        setStatus('Ready', 'ready');
      }
    }
  });
}

    window.electronAPI.setAutoEnter(enabled);
  }
  setStatus(enabled ? 'Paste + Enter enabled' : 'Paste only enabled', 'ready');
});

if (window.electronAPI && window.electronAPI.onWakeModeState) {
  window.electronAPI.onWakeModeState(payload => {
    const enabled = !!(payload && payload.enabled);
    wakeToggle.checked = enabled;
  });
}

if (window.electronAPI && window.electronAPI.onWakePhraseState) {
  window.electronAPI.onWakePhraseState(payload => {
    const phrase = sanitizeWakePhrase(payload && payload.phrase);
    currentWakePhrase = phrase;
    wakePhraseInput.value = phrase;
    localStorage.setItem('wakePhrase', phrase);
    updateWakePhraseCopy();
  });
}

if (window.electronAPI && window.electronAPI.onCustomDictionaryState) {
  window.electronAPI.onCustomDictionaryState(payload => {
    const text = sanitizeCustomDictionaryText(payload && payload.text);
    currentCustomDictionaryText = text;
    customDictionaryInput.value = text;
    localStorage.setItem('customDictionaryText', text);
  });
}

if (window.electronAPI && window.electronAPI.onAutoEnterState) {
  window.electronAPI.onAutoEnterState(payload => {
    const enabled = !!(payload && payload.enabled);
    autoEnterToggle.checked = enabled;
  });
}

loadModels();
</script>
</body>
</html>
