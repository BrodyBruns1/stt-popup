<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STT Popup</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #111;
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
  color: #555;
  min-height: 100vh;
}

/* ── Popup shell ── */
.popup {
  width: 260px;
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  height: 34px;
  background: #161616;
  border-bottom: 1px solid #1e1e1e;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  flex-shrink: 0;
}

.dot-red {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
  flex-shrink: 0;
  animation: blink 1.1s ease-in-out infinite;
}
.dot-red.idle { background: #ef4444; opacity: 0.25; animation: none; }
.dot-red.processing { background: transparent; }
.dot-red.done { background: transparent; }
.dot-red.error { background: transparent; }
.dot-red.wake { background: #3b82f6; opacity: 0.6; animation: none; }

.header-timer {
  font-size: 13px;
  color: #666;
  letter-spacing: 0.04em;
}

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 10px;
  align-items: center;
}

.icon-btn {
  font-size: 9px;
  color: #333;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: color 0.1s;
  user-select: none;
}
.icon-btn:hover { color: #666; }
.icon-btn.active { color: #666; }

/* ── Transcript section ── */
.section {
  padding: 12px 14px;
  border-bottom: 1px solid #191919;
}

.section-label {
  font-size: 8px;
  color: #333;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.transcript-text {
  font-size: 12px;
  color: #888;
  line-height: 1.6;
  min-height: 36px;
  width: 100%;
  background: transparent;
  border: none;
  resize: none;
  outline: none;
  font-family: inherit;
  padding: 0;
  overflow: hidden;
}
.transcript-text:empty::before,
.transcript-text::placeholder {
  content: '–';
  color: #2a2a2a;
}

/* ── Tone row ── */
.tone-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.tone-chip {
  font-size: 9px;
  color: #555;
  background: #1a1a1a;
  border: 1px solid #252525;
  border-radius: 3px;
  padding: 2px 7px;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.tone-chip.accent { color: #888; border-color: #333; }

.gain-inline {
  flex: 1;
  height: 2px;
  background: #1a1a1a;
  border-radius: 1px;
  overflow: hidden;
}
.gain-fill {
  height: 100%;
  background: #ef4444;
  opacity: 0.5;
  border-radius: 1px;
  animation: gain 1.8s ease-in-out infinite alternate;
}

/* ── Actions ── */
.actions {
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.btn {
  flex: 1;
  height: 26px;
  background: #161616;
  border: 1px solid #222;
  border-radius: 4px;
  color: #444;
  font-size: 9px;
  letter-spacing: 0.08em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  transition: border-color 0.1s, color 0.1s;
}
.btn:hover { border-color: #333; color: #666; }
.btn.primary { border-color: #2a2a2a; }
.btn.primary:hover { border-color: #444; color: #888; }
.btn.star-btn { flex: 0; width: 26px; font-size: 11px; }

/* ── Gear panel ── */
.gear-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.2s ease;
  background: #0d0d0d;
  border-top: 0;
}
.gear-panel.open {
  max-height: 260px;
  border-top: 1px solid #191919;
  overflow-y: auto;
}

.panel-label {
  font-size: 8px;
  color: #2a2a2a;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.panel-divider {
  height: 1px;
  background: #191919;
  margin: 0;
}

/* ── Lab section ── */
.lab-section {
  padding: 10px 14px;
}

.lab-title {
  font-size: 10px;
  color: #666;
  margin-bottom: 4px;
}

.lab-note {
  font-size: 9px;
  color: #444;
  line-height: 1.5;
  margin-bottom: 8px;
}

.lab-prompt-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.lab-phrase {
  font-size: 11px;
  color: #888;
}

.lab-summary {
  font-size: 9px;
  color: #444;
  margin-bottom: 6px;
}

.lab-samples {
  margin-bottom: 8px;
}

.lab-sample {
  font-size: 9px;
  color: #555;
  padding: 3px 0;
  border-bottom: 1px solid #1a1a1a;
  display: flex;
  align-items: center;
  gap: 6px;
}

.lab-nav {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}

.lab-actions-row {
  display: flex;
  gap: 6px;
}

/* ── Config section ── */
.config-section {
  padding: 10px 14px;
}

.config-label {
  font-size: 8px;
  color: #333;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
  margin-top: 8px;
}
.config-label:first-of-type { margin-top: 0; }

.config-input {
  width: 100%;
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  border-radius: 3px;
  color: #666;
  font-family: inherit;
  font-size: 11px;
  padding: 4px 6px;
  outline: none;
  resize: none;
}
.config-input:focus { border-color: #2a2a2a; }

/* ── Settings strip ── */
.settings-strip {
  padding: 8px 14px;
  background: #0e0e0e;
  border-top: 1px solid #191919;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-shrink: 0;
}

.setting-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 8px;
  color: #333;
  letter-spacing: 0.06em;
  cursor: pointer;
  user-select: none;
}

.toggle {
  width: 20px;
  height: 10px;
  background: #1e1e1e;
  border: 1px solid #2a2a2a;
  border-radius: 5px;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
}
.toggle.on { background: #2a2a2a; border-color: #444; }
.toggle::after {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #333;
  top: 1px;
  left: 1px;
  transition: left 0.15s, background 0.15s;
}
.toggle.on::after { left: 11px; background: #888; }

.shortcut-hint {
  font-size: 8px;
  color: #252525;
  letter-spacing: 0.06em;
}

/* ── Capture btn in lab ── */
.capture-btn {
  width: 100%;
  height: 28px;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 3px;
  color: #555;
  font-size: 9px;
  letter-spacing: 0.08em;
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 8px;
  transition: border-color 0.1s, color 0.1s;
}
.capture-btn:hover { border-color: #444; color: #888; }
.capture-btn:disabled { opacity: 0.3; cursor: default; }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.15; }
}
@keyframes gain {
  0% { width: 20%; }
  40% { width: 60%; }
  100% { width: 35%; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* spinner for processing state in header */
.h-spinner {
  width: 7px;
  height: 7px;
  border: 1px solid #333;
  border-top-color: #666;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
</style>
</head>

<script>

const tonalityLabNextBtn = document.getElementById('tonalityLabNextBtn');
const tonalityLabOpenBtn = document.getElementById('tonalityLabOpenBtn');
const tonalityLabCopyBtn = document.getElementById('tonalityLabCopyBtn');
const tonalityLabClearBtn = document.getElementById('tonalityLabClearBtn');
const previewActionBtn = document.getElementById('previewActionBtn');
const quitBtn = document.getElementById('quitBtn');

const TONALITY_LAB_PROMPTS = [
  {
    id: 'okay-calm',
    phrase: 'okay',
    targetLabel: 'Calm',
    toneClass: 'calm',
    group: 'baseline',
    instruction: 'Say it flat and conversationally. Do not lean into the mic.',
  },
  {
    id: 'okay-sharp',
    phrase: 'okay',
    targetLabel: 'Sharp Attack',
    toneClass: 'punchy',
    group: 'attack',
    instruction: 'Keep the volume close to normal, but hit the first syllable sharply.',
  },
  {
    id: 'okay-heated',
    phrase: 'okay',
    targetLabel: 'Heated',
    toneClass: 'heated',
    group: 'intensity',
    instruction: 'Say it louder and irritated without moving closer to the mic.',
  },
  {
    id: 'really-flat',
    phrase: 'really',
    targetLabel: 'Calm',
    toneClass: 'calm',
    group: 'baseline',
    instruction: 'Say it flat, not like a question.',
  },
  {
    id: 'really-question',
    phrase: 'really?',
    targetLabel: 'Questioning',
    toneClass: 'questioning',
    group: 'question',
    instruction: 'Say it as a genuine question with rising pitch, not extra loudness.',
  },
  {
    id: 'fuck-calm',
    phrase: 'fuck',
    targetLabel: 'Calm',
    toneClass: 'calm',
    group: 'baseline',
    instruction: 'Say it like a casual aside, not emphasized.',
  },
  {
    id: 'fuck-heated',
    phrase: 'fuck',
    targetLabel: 'Heated',
    toneClass: 'heated',
    group: 'intensity',
    instruction: 'Say it controlled and irritated, but not full-volume shouting.',
  },
  {
    id: 'fuck-shouted',
    phrase: 'FUCK',
    targetLabel: 'Shouted',
    toneClass: 'shouted',
    group: 'intensity',
    instruction: 'Actually shout it once from the same mic distance.',
  },
];

let audioCtx = null;
let analyser = null;
let processor = null;
let mutedGain = null;
let source = null;
let stream = null;
let ws = null;
let meterRAF = null;
let pendingFrames = [];
let liveDraft = '';
let activeLanguage = 'en';
let settingsOpen = false;
let quickPreviewStage = 'idle';
let currentWakePhrase = 'Hey Jenkins';
let currentCustomDictionaryText = '';
let finalizeStopTimer = null;
let currentWindowMode = 'full';
let currentRawTranscript = '';
let activeFullView = 'transcript';
let tonalityLabEnabled = false;
let tonalityLabPromptIndex = 0;
let tonalityLabSamples = [];
let recordedPcmChunks = [];
let recordedSampleRate = 0;
let recordedChannels = 1;

function normalizeTranscriptPayload(payload) {
  if (payload && typeof payload === 'object') {
    const rawText = String(payload.raw_text || payload.rawText || payload.text || '').trim();
    const expressiveText = String(payload.expressive_text || payload.expressiveText || payload.text || '').trim();
    return {
      ...payload,
      text: expressiveText || rawText,
      raw_text: rawText || expressiveText,
      expressive_text: expressiveText || rawText,
      tone: payload.tone || null,
    };
  }

  const text = String(payload || '').trim();
  return {
    text,
    raw_text: text,
    expressive_text: text,
    tone: null,
  };
}

function formatToneLabel(tone) {
  if (!tone || !tone.label) return 'Calm';
  return tone.label.charAt(0).toUpperCase() + tone.label.slice(1);
}

function formatWordLabel(value, fallback) {
  const text = String(value || '').trim();
  if (!text) return fallback;
  return text
    .split(/\s+/)
    .map(part => part.charAt(0).toUpperCase() + part.slice(1))
    .join(' ');
}

function safeParseJSON(value, fallback) {
  try {
    return JSON.parse(value);
  } catch (_) {
    return fallback;
  }
}

function normalizeFullView(value) {
  if (value === 'lab' || value === 'config') return value;
  return 'transcript';
}

function setActiveFullView(view, options) {
  const { persist = true, notify = true } = options || {};
  activeFullView = normalizeFullView(view);
  transcriptPanel.classList.toggle('active', activeFullView === 'transcript');
  labShell.classList.toggle('active', activeFullView === 'lab');
  configPanel.classList.toggle('active', activeFullView === 'config');
  viewButtons.forEach(button => {
    button.classList.toggle('active', button.dataset.view === activeFullView);
  });
  if (persist) {
    localStorage.setItem('fullWindowView', activeFullView);
  }
  if (notify && window.electronAPI && window.electronAPI.setFullWindowView && currentWindowMode === 'full') {
    window.electronAPI.setFullWindowView(activeFullView);
  }
  renderTonalityLab();
}

function resetRecordedAudio() {
  recordedPcmChunks = [];
  recordedSampleRate = 0;
  recordedChannels = 1;
}

function pcmChunksToWavBytes(chunks, sampleRate, channels) {
  const totalDataBytes = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);
  const wavBytes = new Uint8Array(44 + totalDataBytes);
  const view = new DataView(wavBytes.buffer);
  const writeASCII = (offset, value) => {
    for (let index = 0; index < value.length; index += 1) {
      view.setUint8(offset + index, value.charCodeAt(index));
    }
  };

  writeASCII(0, 'RIFF');
  view.setUint32(4, 36 + totalDataBytes, true);
  writeASCII(8, 'WAVE');
  writeASCII(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * channels * 2, true);
  view.setUint16(32, channels * 2, true);
  view.setUint16(34, 16, true);
  writeASCII(36, 'data');
  view.setUint32(40, totalDataBytes, true);

  let offset = 44;
  chunks.forEach(chunk => {
    wavBytes.set(chunk, offset);
    offset += chunk.byteLength;
  });

  return wavBytes;
}

function clampTonalityLabPromptIndex(value) {
  const numeric = Number(value);
  if (!Number.isFinite(numeric)) return 0;
  return Math.max(0, Math.min(TONALITY_LAB_PROMPTS.length - 1, Math.round(numeric)));
}

function currentTonalityLabPrompt() {
  return TONALITY_LAB_PROMPTS[tonalityLabPromptIndex] || TONALITY_LAB_PROMPTS[0];
}

function tonalitySamplesForPrompt(promptId) {
  return tonalityLabSamples.filter(sample => sample.prompt_id === promptId);
}

function averageMetric(samples, key) {
  const values = samples
    .map(sample => Number(sample && sample.tone && sample.tone[key]))
    .filter(value => Number.isFinite(value));
  if (!values.length) return 0;
  return values.reduce((sum, value) => sum + value, 0) / values.length;
}

function escapeHTML(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatLabTimestamp(iso) {
  if (!iso) return '';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '';
  return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

function summarizeTonalityLab(samples) {
  if (!tonalityLabEnabled) {
    return 'Enable Tonality Lab Capture in Config, then run a few calm takes first. Each take will save a WAV clip so we can compare the audio against the metrics.';
  }

  if (!samples.length) {
    return 'Run 2 to 3 calm takes first. If those already look hot, the mic gain or AGC is probably part of the problem.';
  }

  const notes = [];
  const baseline = samples.filter(sample => sample.prompt_group === 'baseline' && sample.tone);
  const question = samples.filter(sample => sample.prompt_group === 'question' && sample.tone);
  const intensity = samples.filter(sample => sample.prompt_group === 'intensity' && sample.tone);

  if (baseline.length) {
    const avgPeak = averageMetric(baseline, 'peak_level');
    const avgAttack = averageMetric(baseline, 'attack_score');
    const avgEmphasis = averageMetric(baseline, 'emphasis');
    if (avgPeak >= 0.55 || avgEmphasis >= 0.56) {
      notes.push('Calm takes are still reading hot, so mic gain or automatic gain control may be lifting the whole signal.');
    } else {
      notes.push('Calm takes are staying in a usable range, which makes threshold tuning easier.');
    }
    if (avgAttack >= 0.48) {
      notes.push('Calm takes still look sharp on attack, so the front-edge threshold is probably too low or the mic is spiking every onset.');
    }
  }

  if (question.length) {
    const risingCount = question.filter(sample => {
      const inflection = String(sample.tone && sample.tone.inflection || '');
      const trend = String(sample.tone && sample.tone.pitch_trend || '');
      return inflection === 'questioning' || inflection === 'rising' || trend === 'rising';
    }).length;
    if (risingCount === 0) {
      notes.push('Question takes are not reading as rising yet, so pitch weighting may be too weak.');
    } else if (risingCount < question.length) {
      notes.push('Question takes are partially separating, which means pitch is helping but not consistently enough yet.');
    }
  }

  if (intensity.length) {
    const loudCount = intensity.filter(sample => {
      const label = String(sample.tone && sample.tone.label || '');
      return label === 'heated' || label === 'shouted';
    }).length;
    if (loudCount === 0) {
      notes.push('Heated takes are not separating from calm takes yet, so the intensity thresholds still need work.');
    }
  }

  return notes.slice(0, 3).join(' ');
}

async function captureTonalityLabSample(transcriptPayload, payload) {
  if (!tonalityLabEnabled || !recordedPcmChunks.length || !recordedSampleRate) return null;
  const prompt = currentTonalityLabPrompt();
  const stamp = new Date();
  const timestamp = stamp.toISOString().replace(/[:.]/g, '-');
  const clipBytes = pcmChunksToWavBytes(recordedPcmChunks, recordedSampleRate, recordedChannels);
  let clipMeta = null;
  if (window.electronAPI && window.electronAPI.saveTonalityClip) {
    clipMeta = await window.electronAPI.saveTonalityClip({
      file_name: `${prompt.id}-${timestamp}`,
      bytes: clipBytes.buffer,
    });
  }

  const sample = {
    captured_at: stamp.toISOString(),
    prompt_id: prompt.id,
    prompt_group: prompt.group,
    prompt_phrase: prompt.phrase,
    prompt_target: prompt.targetLabel,
    text: String(transcriptPayload.text || '').trim(),
    raw_text: String(transcriptPayload.raw_text || '').trim(),
    duration: Number(payload && payload.duration) || 0,
    tone: transcriptPayload.tone || null,
    clip_name: clipMeta && clipMeta.file_name ? clipMeta.file_name : '',
    clip_path: clipMeta && clipMeta.path ? clipMeta.path : '',
  };

  tonalityLabSamples = tonalityLabSamples.concat([
    sample,
  ]).slice(-80);
  persistTonalityLabState();
  renderTonalityLab();
  return sample;
}

function sanitizeWakePhrase(value) {
  const normalized = String(value || '')
    .replace(/\s+/g, ' ')
    .trim();
  return normalized || 'Hey Jenkins';
}

function sanitizeCustomDictionaryText(value) {
  return String(value || '')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n');
}

function parseCustomDictionary(text) {
  return sanitizeCustomDictionaryText(text)
    .split('\n')
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      if (line.includes('=>')) {
        const [left, ...rightParts] = line.split('=>');
        return { left: left.trim(), right: rightParts.join('=>').trim() };
      }

      const braceMatch = line.match(/^\{(.+?)\}\s+(.+)$/);
      if (braceMatch) {
        return { left: braceMatch[1].trim(), right: braceMatch[2].trim() };
      }

      return null;
    })
    .filter(Boolean)
    .map(rule => {
      const matches = rule.left
        .split('|')
        .map(value => value.trim())
        .filter(Boolean);
      const replacement = rule.right.trim();
      if (!matches.length || !replacement) {
        return null;
      }
      return { matches, replacement };
    })
    .filter(Boolean);
}

function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < float32Array.length; i += 1) {
    const sample = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
  }
  return buffer;
}

function sendAudioFrame(frame) {
  if (!ws) return;
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(frame);
    return;
  }
  if (ws.readyState === WebSocket.CONNECTING) {
    pendingFrames.push(frame);
  }
}

function clearFinalizeStopTimer() {
  if (finalizeStopTimer) {
    clearTimeout(finalizeStopTimer);
    finalizeStopTimer = null;
  }
}

function closeSocket() {
  if (ws) {
    try {
      ws.close();
    } catch (_) {}
    ws = null;
  }
  pendingFrames = [];
}

function clearAudioGraph() {
  clearFinalizeStopTimer();
  if (meterRAF) {
    cancelAnimationFrame(meterRAF);
    meterRAF = null;
  }
  if (processor) {
    processor.disconnect();
    processor.onaudioprocess = null;
    processor = null;
  }
  if (source) {
    source.disconnect();
    source = null;
  }
  if (mutedGain) {
    mutedGain.disconnect();
    mutedGain = null;
  }
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
    analyser = null;
  }
  meter.style.width = '0%';
}

function clearPipeline() {
  closeSocket();
  clearAudioGraph();
}

function updateMeter() {
  if (!analyser) return;
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  const rms = Math.sqrt(data.reduce((sum, value) => sum + value * value, 0) / data.length);
  const pct = Math.max(0, Math.min(100, (20 * Math.log10(Math.max(rms, 1e-10)) + 60) / 60 * 100));
  meter.style.width = pct + '%';
  meterRAF = requestAnimationFrame(updateMeter);
}

async function startRecording() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (error) {
    setStatus('Mic denied: ' + error.message, 'error');
    return;
  }

  liveDraft = '';
  activeLanguage = 'en';
  pendingFrames = [];
  transcription.value = '';
  currentRawTranscript = '';
  enhanced.value = '';
  resetRecordedAudio();
  updateToneUI(null);
  setLiveMode(true);

  ws = new WebSocket(WS_API);
  ws.binaryType = 'arraybuffer';
  ws.addEventListener('open', () => {
    const customDictionary = parseCustomDictionary(currentCustomDictionaryText);
    ws.send(JSON.stringify({
      type: 'start',
      mode: 'dictation',
      sample_rate: audioCtx ? audioCtx.sampleRate : 48000,
      channels: 1,
      language: 'en',
      partial_interval_ms: 800,
      custom_dictionary: customDictionary,
    }));
    while (pendingFrames.length > 0 && ws.readyState === WebSocket.OPEN) {
      ws.send(pendingFrames.shift());
    }
  });

  ws.addEventListener('message', async event => {
    const payload = JSON.parse(event.data);
    if (payload.type === 'partial') {
      const transcriptPayload = updateToneUI(payload);
      liveDraft = transcriptPayload.text || liveDraft;
      activeLanguage = transcriptPayload.language || activeLanguage;
      if (liveDraft) transcription.value = liveDraft;
      transcription.scrollTop = transcription.scrollHeight;
      const toneLabel = transcriptPayload.tone ? ' · ' + formatToneLabel(transcriptPayload.tone) : '';
      setStatus('Recording... live draft updating' + toneLabel, 'busy');
      return;
    }

    if (payload.type === 'final') {
      clearAudioGraph();
      const transcriptPayload = updateToneUI(payload);
      const finalText = (transcriptPayload.text || liveDraft || '').trim();
      transcription.value = finalText;
      transcription.scrollTop = transcription.scrollHeight;
      setLiveMode(false);
      const savedSample = await captureTonalityLabSample(transcriptPayload, payload);
      resetRecordedAudio();
      const lang = payload.language ? '  ' + payload.language.toUpperCase() : '';
      const dur = payload.duration ? '  ' + payload.duration + 's' : '';
      const toneLabel = transcriptPayload.tone ? ' · ' + formatToneLabel(transcriptPayload.tone) : '';
      const labSaved = savedSample && savedSample.clip_name ? ` · clip ${savedSample.clip_name}` : tonalityLabEnabled ? ' · saved to Tonality Lab' : '';
      setStatus('Done' + toneLabel + lang + dur + labSaved, 'ready');
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      enhanceBtn.disabled = !finalText;
      closeSocket();
      return;
    }

    if (payload.type === 'error') {
      clearAudioGraph();
      if (liveDraft) {
        transcription.value = liveDraft;
        enhanceBtn.disabled = !liveDraft.trim();
        setLiveMode(false);
        resetRecordedAudio();
        setStatus('Draft ready', 'ready');
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        closeSocket();
        return;
      }
      setLiveMode(false);
      resetRecordedAudio();
      setStatus('Error: ' + payload.message, 'error');
      recordBtn.disabled = false;
      stopBtn.disabled = true;
      closeSocket();
    }
  });

  ws.addEventListener('close', () => {
    ws = null;
    pendingFrames = [];
  });

  audioCtx = new AudioContext();
  recordedSampleRate = audioCtx.sampleRate || 48000;
  recordedChannels = 1;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  mutedGain = audioCtx.createGain();
  mutedGain.gain.value = 0;

  source.connect(analyser);
  source.connect(processor);
  processor.connect(mutedGain);
  mutedGain.connect(audioCtx.destination);

  processor.onaudioprocess = event => {
    const input = event.inputBuffer.getChannelData(0);
    const pcmFrame = floatTo16BitPCM(input);
    recordedPcmChunks.push(new Uint8Array(pcmFrame.slice(0)));
    sendAudioFrame(pcmFrame);
  };

  meterRAF = requestAnimationFrame(updateMeter);
  recordBtn.disabled = true;
  recordBtn.classList.add('recording');
  stopBtn.disabled = false;
  enhanceBtn.disabled = true;
  setStatus('Recording...', 'busy');
}

function stopRecording() {
  clearFinalizeStopTimer();
  recordBtn.classList.remove('recording');
  recordBtn.disabled = true;
  stopBtn.disabled = true;
  setStatus('Finalizing transcript...', 'busy');

  finalizeStopTimer = setTimeout(() => {
    clearAudioGraph();

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('stop');
      return;
    }

    closeSocket();
    setLiveMode(false);
    resetRecordedAudio();
    recordBtn.disabled = false;
    setStatus(liveDraft ? 'Draft ready' : 'Error', liveDraft ? 'ready' : 'error');
  }, 260);
}

    setStatus('Error: ' + error.message, 'error');

    enhanceBtn.disabled = false;

}

function sliderToMs(value) {

function msToLabel(ms) {
  if (!isFinite(ms)) return '∞';
  if (ms < 10000) return (ms / 1000).toFixed(1) + 's';
  return Math.round(ms / 1000) + 's';
}

if (window.electronAPI && window.electronAPI.onQuickSessionState) {
  window.electronAPI.onQuickSessionState(payload => {
    const stage = payload && payload.stage;
    quickPreviewStage = stage || 'idle';

    if (stage === 'recording') {
      setPreviewAction(null);
      if (!transcription.value.trim()) transcription.value = '';
      enhanced.value = '';
      enhanceBtn.disabled = true;
      setLiveMode(true);
      setStatus('Listening... live preview attached to quick-record', 'busy');
      return;
    }

    if (stage === 'finalizing') {
      setPreviewAction(null);
      setLiveMode(true);
      setStatus('Finalizing preview before paste...', 'busy');
      return;
    }

    if (stage === 'preview') {
      setLiveMode(false);
      setStatus('Previewing final text before paste...', 'ready');
      setPreviewAction('paste');
      return;
    }

    if (stage === 'pasted') {
      setLiveMode(false);
      setStatus('Pasted', 'ready');
      setPreviewAction('done');
      return;
    }

    if (stage === 'error') {
      setPreviewAction(null);
      setLiveMode(false);
      setStatus('Quick-record error', 'error');
      return;
    }

    if (stage === 'idle') {
      setPreviewAction(null);
      setLiveMode(false);
      if (!transcription.value.trim()) {
        setStatus('Ready', 'ready');
      }
    }

<!-- ── New UI wiring ── -->
<script>
(function () {

  // ── Header dot + timer ──────────────────────────────────────────────────
  const _hDot   = document.getElementById('_hDot');
  const _hTimer = document.getElementById('_hTimer');
  let _timerInterval = null;
  let _timerSecs = 0;

  function _startHeaderTimer() {
    _timerSecs = 0;
    _hTimer.textContent = '0:00';
    clearInterval(_timerInterval);
    _timerInterval = setInterval(() => {
      _timerSecs++;
      const m = Math.floor(_timerSecs / 60);
      const s = _timerSecs % 60;
      _hTimer.textContent = m + ':' + String(s).padStart(2, '0');
    }, 1000);
  }

  function _stopHeaderTimer() {
    clearInterval(_timerInterval);
    _timerInterval = null;
  }

  function _setHeaderState(state) {
    // state: 'idle' | 'recording' | 'processing' | 'done' | 'error' | 'wake'
    // Remove any spinner that was inserted
    const existing = _hDot.parentNode.querySelector('.h-spinner');
    if (existing) existing.remove();
    _hDot.style.display = '';

    if (state === 'processing') {
      _hDot.style.display = 'none';
      const sp = document.createElement('div');
      sp.className = 'h-spinner';
      _hDot.parentNode.insertBefore(sp, _hDot);
    } else if (state === 'done') {
      _hDot.style.display = 'none';
      // brief checkmark via text node next to timer
      _hTimer.textContent = '✓';
      setTimeout(() => {
        _hTimer.textContent = '0:00';
        _hDot.style.display = '';
        _hDot.className = 'dot-red idle';
      }, 1500);
    } else if (state === 'error') {
      _hDot.style.display = 'none';
      _hTimer.textContent = '✕';
      setTimeout(() => {
        _hTimer.textContent = '0:00';
        _hDot.style.display = '';
        _hDot.className = 'dot-red idle';
      }, 2000);
    } else {
      _hDot.className = 'dot-red' + (state === 'idle' ? ' idle' : state === 'wake' ? ' wake' : '');
    }
  }

  // Watch quick session state for header updates
  if (window.electronAPI && window.electronAPI.onQuickSessionState) {
    window.electronAPI.onQuickSessionState(payload => {
      const stage = payload && payload.stage;
      if (stage === 'recording') { _startHeaderTimer(); _setHeaderState('recording'); }
      else if (stage === 'finalizing') { _stopHeaderTimer(); _setHeaderState('processing'); }
      else if (stage === 'pasted')    { _setHeaderState('done'); }
      else if (stage === 'error')     { _stopHeaderTimer(); _setHeaderState('error'); }
      else if (stage === 'idle')      { _stopHeaderTimer(); _setHeaderState('idle'); }
    });
  }

  // ── Gear panel toggle ────────────────────────────────────────────────────
  const _gearBtn   = document.getElementById('_gearBtn');
  const _gearPanel = document.getElementById('_gearPanel');
  let _panelOpen   = false;

  _gearBtn.addEventListener('click', () => {
    _panelOpen = !_panelOpen;
    _gearPanel.classList.toggle('open', _panelOpen);
    _gearBtn.classList.toggle('active', _panelOpen);
    if (_panelOpen) {
      // Ensure renderTonalityLab sees the right state
      currentWindowMode = 'full';
      activeFullView = 'lab';
      tonalityLabEnabled = true;
      renderTonalityLab();
    }
    if (window.electronAPI && window.electronAPI.resizePopup) {
      window.electronAPI.resizePopup(_panelOpen);
    }
  });

  // ── COPY button ──────────────────────────────────────────────────────────
  document.getElementById('_copyBtn').addEventListener('click', () => {
    const text = transcription.value.trim();
    if (!text) return;
    navigator.clipboard.writeText(text);
  });

  // ── INJECT button ────────────────────────────────────────────────────────
  document.getElementById('_injectBtn').addEventListener('click', () => {
    const text = (enhanced.value || transcription.value || '').trim();
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      if (window.electronAPI && window.electronAPI.hideWindow) {
        window.electronAPI.hideWindow();
      }
    });
  });

  // ── ✦ Enhance button ─────────────────────────────────────────────────────
  document.getElementById('_starBtn').addEventListener('click', async () => {
    await enhanceText();
    if (enhanced.value) transcription.value = enhanced.value;
    _updateWordCount();
  });

  // ── TAKE (capture) button ────────────────────────────────────────────────
  document.getElementById('_captureBtn').addEventListener('click', () => {
    if (typeof captureTonalityLabSample !== 'function') return;
    const text = (transcription.value || '').trim();
    const tp = normalizeTranscriptPayload({ text, raw_text: text, tone: null });
    captureTonalityLabSample(tp, {});
  });

  // ── Word count chip ──────────────────────────────────────────────────────
  const _wordChip = document.getElementById('_wordChip');
  function _updateWordCount() {
    const text = (transcription.value || '').trim();
    const count = text ? text.split(/\s+/).length : 0;
    _wordChip.textContent = count + 'w';
  }

  // Wrap updateToneUI to also refresh word count
  const _origUpdateToneUI = updateToneUI;
  updateToneUI = function (payload) {
    const result = _origUpdateToneUI.call(this, payload);
    _updateWordCount();
    return result;
  };

  // ── Visual WAKE toggle ───────────────────────────────────────────────────
  const _wakeViz  = document.getElementById('_wakeViz');
  const _wakeItem = document.getElementById('_wakeItem');

  function _syncWakeViz() {
    _wakeViz.classList.toggle('on', wakeToggle.checked);
    _wakeLabel.classList.toggle('active', wakeToggle.checked);
  }

  // Sync initial state after old script ran (it sets wakeToggle.checked)
  _syncWakeViz();

  _wakeItem.addEventListener('click', () => {
    wakeToggle.checked = !wakeToggle.checked;
    wakeToggle.dispatchEvent(new Event('change'));
    _syncWakeViz();
  });

  // Keep in sync when IPC updates toggle
  wakeToggle.addEventListener('change', _syncWakeViz);

  // Grab _wakeLabel ref
  const _wakeLabel = document.getElementById('_wakeLabel');
  _wakeLabel.addEventListener('click', (e) => {
    e.stopPropagation(); // handled by _wakeItem
  });

  // ── Visual ENHANCE toggle ────────────────────────────────────────────────
  const _enhViz  = document.getElementById('_enhViz');
  const _enhItem = document.getElementById('_enhItem');
  let _autoEnhance = localStorage.getItem('autoEnhanceEnabled') === '1';
  _enhViz.classList.toggle('on', _autoEnhance);

  _enhItem.addEventListener('click', () => {
    _autoEnhance = !_autoEnhance;
    localStorage.setItem('autoEnhanceEnabled', _autoEnhance ? '1' : '0');
    _enhViz.classList.toggle('on', _autoEnhance);
  });

  // If auto-enhance is on, run enhance after live text arrives
  if (window.electronAPI && window.electronAPI.onLiveText) {
    window.electronAPI.onLiveText(payload => {
      if (_autoEnhance && payload && !payload.partial) {
        enhanceText().then(() => {
          if (enhanced.value) { transcription.value = enhanced.value; _updateWordCount(); }
        });
      }
    });
  }

  // Initial word count
  _updateWordCount();

})();
</script>
